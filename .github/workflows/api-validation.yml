
name: Validate Financial APIs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate Fuyao and iFinD
        env:
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
          IFIND_MCP_AUTHORIZATION: ${{ secrets.IFIND_MCP_AUTHORIZATION }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          def post_json(url, payload, headers):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers=headers,
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  raw = r.read(200000).decode()
                  content_type = r.headers.get("Content-Type", "")
                  session = r.headers.get("Mcp-Session-Id")
                  if "text/event-stream" in content_type:
                      for line in raw.splitlines():
                          if line.startswith("data:"):
                              try:
                                  obj = json.loads(line[5:].strip())
                                  if "result" in obj or "error" in obj:
                                      return obj, session
                              except ValueError:
                                  continue
                      raise ValueError("No MCP JSON-RPC response")
                  return json.loads(raw), session

          failures = []

          print("=== Fuyao ===")
          key = os.getenv("FUYAO_API_KEY", "")
          if not key:
              failures.append("Fuyao secret missing")
          else:
              url = (
                  "https://fuyao.aicubes.cn"
                  "/api/a-share/prices/snapshot"
                  "?thscodes=600519.SH"
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "X-api-key": key,
                      "Accept": "application/json"
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body = json.load(r)
                  if body.get("code") == 0 and body.get("data"):
                      print("PASS: Fuyao returned data")
                  else:
                      failures.append(
                          "Fuyao returned no successful data"
                      )
              except urllib.error.HTTPError as e:
                  if e.code == 429:
                      print("WARN: Fuyao HTTP 429 (rate limit or quota). Fuyao validation inconclusive; no fabricated PASS.")
                  else:
                      failures.append(
                          "Fuyao HTTP status: " + str(e.code)
                          + " (response body suppressed to protect credentials)"
                      )
              except urllib.error.URLError as e:
                  failures.append(
                      "Fuyao network error: " + type(e.reason).__name__
                  )
              except Exception as e:
                  failures.append(
                      "Fuyao request failed: " + type(e).__name__
                  )

          print("=== iFinD MCP ===")
          token = os.getenv("IFIND_MCP_AUTHORIZATION", "")
          endpoint = (
              "https://api-mcp.51ifind.com:8643"
              "/ds-mcp-servers/hexin-ifind-ds-mcp"
          )
          if not token:
              failures.append("iFinD secret missing")
          else:
              headers = {
                  "Authorization": token,
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream",
                  "MCP-Protocol-Version": "2025-03-26"
              }
              try:
                  init, session = post_json(
                      endpoint,
                      {
                          "jsonrpc": "2.0",
                          "id": 1,
                          "method": "initialize",
                          "params": {
                              "protocolVersion": "2025-03-26",
                              "capabilities": {},
                              "clientInfo": {
                                  "name": "stocklens-validator",
                                  "version": "1.0.0"
                              }
                          }
                      },
                      headers
                  )
                  if "result" not in init:
                      raise ValueError("Initialize failed")

                  print("PASS: iFinD initialized")

                  if session:
                      headers["Mcp-Session-Id"] = session

                  tools, _ = post_json(
                      endpoint,
                      {
                          "jsonrpc": "2.0",
                          "id": 2,
                          "method": "tools/list",
                          "params": {}
                      },
                      headers
                  )
                  result = tools.get("result", {})
                  tool_list = result.get("tools", [])
                  if isinstance(tool_list, list):
                      print(
                          "PASS: tools/list, count =",
                          len(tool_list)
                      )
                      print("=== iFinD Available Tools ===")
                      for tool in tool_list:
                          if not isinstance(tool, dict):
                              continue
                          print(json.dumps({
                              "name": tool.get("name"),
                              "description": tool.get("description"),
                              "inputSchema": tool.get("inputSchema")
                          }, ensure_ascii=False, indent=2))
                  else:
                      failures.append("Invalid iFinD tools/list")

                  print("=== iFinD tools/call smoke test ===")
                  called, _ = post_json(
                      endpoint,
                      {
                          "jsonrpc": "2.0", "id": 3, "method": "tools/call",
                          "params": {"name": "search_securities", "arguments": {
                              "market": "股票",
                              "query": "A股市盈率TTM小于30倍，最多返回3只股票"
                          }}
                      },
                      headers
                  )
                  payload = called.get("result", {})
                  if not isinstance(payload, dict) or payload.get("isError"):
                      failures.append("iFinD tools/call returned error")
                  else:
                      blocks = payload.get("content", [])
                      texts = [x.get("text", "") for x in blocks
                               if isinstance(x, dict) and x.get("type") == "text"]
                      if not texts:
                          failures.append("iFinD tools/call returned no text")
                      else:
                          print("PASS: iFinD tools/call, blocks =", len(texts))
                          for value in texts[:2]:
                              try:
                                  parsed = json.loads(value)
                                  print("JSON result type:", type(parsed).__name__)
                                  if isinstance(parsed, dict):
                                      print("Result keys:", sorted(parsed.keys())[:30])
                                      for k, v in parsed.items():
                                          if isinstance(v, list):
                                              print("Array field:", k, "count:", len(v))
                                              if v and isinstance(v[0], dict):
                                                  print("First item keys:", sorted(v[0].keys())[:30])
                              except ValueError:
                                  print("Non-JSON text length:", len(value), "(content suppressed)")

              except Exception as e:
                  failures.append(
                      "iFinD request failed: "
                      + type(e).__name__
                  )

          for error in failures:
              print("FAIL:", error)

          if failures:
              raise SystemExit(1)

          print("API connectivity validation finished; check WARN entries for unverified providers")
          PY
