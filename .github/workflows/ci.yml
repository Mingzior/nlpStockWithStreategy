name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use fixed npm Arborist
        run: npm install --global npm@11.19.1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
