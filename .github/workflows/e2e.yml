name: Browser E2E
on:
  push:
    branches: [main]
    paths:
      - 'code/site/**'
      - 'code/e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'code/site/**'
      - 'code/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real Chromium interactions
        run: npm test
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: code/e2e/playwright-report
          retention-days: 14
