name: Deploy GitHub Pages Demo
on:
  push:
    branches: [main]
    paths:
      - 'code/site/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone page
        run: |
          test -s code/site/index.html
          grep -q '合成数据演示版' code/site/index.html
          grep -q 'localStorage' code/site/index.html
          python3 -c "from pathlib import Path; s=Path('code/site/index.html').read_text(); Path('/tmp/stocklens-static.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/stocklens-static.js
          if grep -qE 'IFIND_MCP_AUTHORIZATION|FUYAO_API_KEY' code/site/index.html; then exit 1; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: code/site
      - id: deployment
        uses: actions/deploy-pages@v4
